<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>故事卡｜LIFE+ 色彩記憶球</title>
<link rel="icon" href="../favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card" id="card">
  <div class="aura" aria-hidden="true"></div>

  <div class="scroll">
    <!-- 1. 記憶球頂部 -->
    <header class="orb-head">
      <div class="orb" id="orb" role="img"></div>
      <div class="orb-meta">
        <span class="orb-word" id="orbWord"></span>
        <span class="orb-date" id="orbDate"></span>
      </div>
    </header>

    <!-- 2. 標題 -->
    <h1 class="title" id="title"></h1>

    <!-- 3. 播放器 -->
    <section class="player" id="player" hidden>
      <button type="button" class="play-btn" id="playBtn" aria-label="播放原音">
        <svg class="ic-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
        <svg class="ic-pause" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="8" y1="5" x2="8" y2="19"/><line x1="16" y1="5" x2="16" y2="19"/></svg>
      </button>
      <div class="player-body">
        <div class="wave" id="wave" role="slider" tabindex="0" aria-label="播放進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
        <div class="times"><span id="tNow">00:00</span><span id="tTotal">00:00</span></div>
      </div>
      <audio id="audio" preload="metadata"></audio>
    </section>

    <!-- 4. 照片輪播 -->
    <section class="photos" id="photos" hidden>
      <div class="photo-frame">
        <div class="track" id="track"></div>
        <button type="button" class="nav prev" id="prev" aria-label="上一張">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <button type="button" class="nav next" id="next" aria-label="下一張">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
      <div class="dots" id="dots" aria-hidden="true"></div>
    </section>

    <!-- 5. 文字 -->
    <section class="story">
      <p class="story-text" id="text"></p>
      <button type="button" class="expand" id="expand" hidden>… 展開全文</button>
    </section>
  </div>

  <!-- 6. 底部 -->
  <footer class="bar">
    <button type="button" class="btn ghost" id="openSheet"><span class="dot-swatch" id="swatch" aria-hidden="true"></span>改色</button>
    <button type="button" class="btn primary" id="close">關閉</button>
  </footer>

  <!-- 改色面板 -->
  <div class="sheet-mask" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head">
        <span class="sheet-title" id="sheetTitle">這段回憶是什麼顏色？</span>
        <span class="sheet-sub">目前：<span id="sheetNow"></span></span>
      </div>
      <div class="chips" id="chips"></div>
      <button type="button" class="btn primary" id="closeSheet">完成</button>
    </div>
  </div>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
